                        type: string
                        description: Transaction ID
                        example: C002190726165745657448250
                      status_code:
                        type: string
                        description: Status code
                        example: '00000'
                      status_desc:
                        type: string
                        description: Status description
                        example: Success
                  sms_information:
                    type: object
                    required:
                    - transaction_id
                    - message_id
                    - sender_id
                    - recipient
                    - status
                    properties:
                      transaction_id:
                        description: Transaction ID
                        type: string
                        example: C002190926121907251348411
                      message_id:
                        description: SMS Message ID
                        type: string
                        example: 22D40100
                      sender_id:
                        description: SMS Sender ID
                        type: string
                        example: YOURCOMPANY
                      recipient:
                        description: Telkomsel MSISDN
                        type: string
                        example: 62811xx
                      status:
                        description: Status of SMS delivery
                        type: string
                        example: DELIVRD
        '400':
          description: Empty Mandatory Parameter / Invalid MSISDN / Invalid Sender ID
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                properties:
                  transaction:
