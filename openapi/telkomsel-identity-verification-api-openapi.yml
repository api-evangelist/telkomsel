  /digihub/v2/idverification:
    post:
      summary: ID Verification V2
      operationId: idVerV2
      description: API to GET score location customer.
      parameters:
      - in: header
        name: api_key
        example: e688u2hgpkzjd244wecywwv8
        description: API Key / Package Key from Digihub
        required: true
        schema:
          type: string
      - in: header
        name: x-signature
        example: ff080f3200a5945deeb59ad65e2b33788f5df49066a82afcf8b6d5bf43ff76ea
        description: SHA256 (API Key + Secret Key + timeStamp). [More info](https://digihub.telkomsel.com/documentation/consumer-guide/api-authentication)
        required: true
        schema:
          type: string
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transaction
              - consent
              properties:
                transaction:
                  type: object
                  required:
                  - home_work
                  properties:
                    transaction_id:
                      description: Transaction ID
                      type: string
                      example: 040520181127010000
                    home_work:
                      description: Home = 1, Work= 0
                      type: string
                      example: '1'
                      enum:
                      - '0'
                      - '1'
                    long:
                      description: Longitude
                      type: string
                      example: '-6.247895'
                    lat:
                      description: Latitude
                      type: string
                      example: '106.821312'
                    address:
                      description: 'Format address : Street, Village/Urban Commune, District , City/Regency, Province'
                      type: string
                      example: Jl. Kemang Selatan No.30 RT9 RW1, Bangka, Mampang Prapatan,   Kota Jakarta Selatan, Daerah Khusus Ibukota Jakarta
                    zip_code:
                      description: Postal code
                      type: string
                      example: '12790'
                sms:
                  type: object
                  required:
                  - msisdn
                  - consent_id
                  - code
                  properties:
                    msisdn:
                      description: MSISDN starts with “62” for Indonesia calling code.
                      type: string
                      example: 62811xx
                    consent_id:
                      description: Consent id which is registered.
                      type: string
                      example: Ek2arznC2uxeknsXbvdCChqbjAU1SBJ3qUoHEH19y4O74GxZzG0mUKKI/tuHPNbN2KNd+JZ3fYoodC/24A==
                    code:
                      description: Code api identification v2 given by Telkomsel.
                      type: string
                      example: y473hkpghfmju7zxmtdjgfkr
            examples:
              By longitude and latitude:
                value:
                  transaction:
                    transaction_id: 040520181127010000
                    home_work: '1'
                    long: -6.247895
                    lat: 106.821312
                    address: null
                    zip_code: null
                  consent:
                    msisdn: 62811xx
                    consent_id: Ek2arznC2uxeknsXbvdCChqbjAU1SBJ3qUoHEH19y4O74GxZzG0mUKKI/tuHPNbN2KNd+JZ3fYoodC/24A==
                    code: y473hkpghfmju7zxmtdjgfkr
              By address:
                value:
                  transaction:
                    transaction_id: 040520181127010000
                    home_work: '1'
                    long: null
                    lat: null
                    address: Jl. Kemang Selatan No.30 RT9 RW1, Bangka, Mampang Prapatan,Kota Jakarta Selatan, Daerah Khusus Ibukota Jakarta
                    zip_code: null
                  consent:
                    msisdn: 62811xx
                    consent_id: Ek2arznC2uxeknsXbvdCChqbjAU1SBJ3qUoHEH19y4O74GxZzG0mUKKI/tuHPNbN2KNd+JZ3fYoodC/24A==
                    code: y473hkpghfmju7zxmtdjgfkr
              By zipcode:
                value:
                  transaction:
                    transaction_id: 040520181127010000
                    home_work: '1'
                    long: null
                    lat: null
                    address: null
                    zip_code: '12790'
                  consent:
                    msisdn: 62811xx
                    consent_id: Ek2arznC2uxeknsXbvdCChqbjAU1SBJ3qUoHEH19y4O74GxZzG0mUKKI/tuHPNbN2KNd+JZ3fYoodC/24A==
                    code: y473hkpghfmju7zxmtdjgfkr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                - response
                properties:
                  transaction:
                    type: object
                    required:
                    - transaction_id
                    - status_code
                    - status_desc
                    properties:
                      transaction_id:
                        description: Transaction ID
                        type: string
                        example: 040520181127010000
                      status_code:
                        description: Status code
                        type: string
                        example: '00000'
                      status_desc:
                        description: Status descriptiona
                        type: string
                        example: Success
                  sms_information:
                    type: object
                    required:
                    - msisdn
                    - score
                    properties:
                      msisdn:
                        description: MSISDN
                        type: string
                        example: 62811xx
                      score:
                        description: Score from 1-7
                        type: string
                        example: 2
        '400':
          description: Empty mandatory parameter / Invalid MSISDN / Invalid Format Request / Data Not Found
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                properties:
                  transaction:
                    type: object
                    required:
                    - transaction_id
                    - status_code
                    - status_desc
                    properties:
                      transaction_id:
                        description: Transaction ID
                        type: string
                        example: 040520181127010000
                      status_code:
                        description: Status code
                        type: string
                        example: '00000'
                      status_desc:
                        description: Status descriptiona
                        type: string
                        example: Success
              examples:
                Empty mandatory parameter:
                  value:
                    transaction:
                      transaction_id: 040520181127010000
                      status_code: '20001'
                      status_desc: Empty mandatory parameter
                Invalid MSISDN:
                  value:
                    transaction:
                      transaction_id: 040520181127010000
                      status_code: '20002'
                      status_desc: Invalid MSISDN
                Invalid Format Request:
                  value:
                    transaction:
                      transaction_id: 040520181127010000
                      status_code: IDVER-001
                      status_desc: Invalid Format Request
                Data Not Found:
                  value:
                    transaction:
                      transaction_id: 040520181127010000
                      status_code: IDVER-002
                      status_desc: Data Not Found
        '500':
          description: ESB internal error
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                properties:
                  transaction:
                    type: object
                    required:
