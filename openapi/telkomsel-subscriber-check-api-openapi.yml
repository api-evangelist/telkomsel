          type: string
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transaction
              properties:
                transaction:
                  type: object
                  required:
                  - transaction_id
                  - key
                  properties:
                    transaction_id:
                      description: Unique alphanumeric character generated by partner, max 20 char
                      type: string
                      example: TEST001
                    key:
                      description: Service Type
                      type: string
                      example: msisdn
                consent:
                  type: object
                  required:
                  - partner_id
                  - consent_id
                  properties:
                    partner_id:
                      description: Given by Telkomsel.
                      type: string
                      example: TfbQQR5oaTqWb0dp5qdrI7XnLBwHdfskahBbc17ghPyO7WalKR/nIw+EPblJPHd/iNsUC9Nwmfis=
                    consent_id:
                      description: Received in API Login (Consent Management).
                      type: string
                      example: XvbWQR5oaTqWb0dp5qdrI7XnLBx5/tJi+D8+o95gdzWeN8liKI3FqYx7XCosC7HnLMZTrdskKCucN9ec7up/Z2mK2e+5mhd/VcY984Jp8jsafbaRBy7XRFT+ueou4UZjg3E3Q=
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                properties:
                  transaction:
                    type: object
                    required:
                    - transaction_id
                    - status_code
                    - status_desc
                    properties:
                      transaction_id:
                        description: Transaction ID.
                        type: string
                        example: TEST001
                      status_code:
                        description: Status Code.
                        type: string
                        example: '00000'
                      status_desc:
                        description: Status Description.
                        type: string
                        example: Success
                  request:
                    type: object
                    required:
                    - result
                    properties:
                      result:
                        description: result
                        type: string
                        example: ACTIVE
        '400':
          description: Invalid MSISDN / Customer not active / Parameter Param is invalid format
          content:
            application/json:
              schema:
                type: object
                required:
                - transaction
                properties:
                  transaction_id:
                    description: Transaction ID
                    type: string
                    example: C002190726165745657448250
                  status_code:
                    description: Status Code
                    type: string
                    example: '20012'
                  status_desc:
                    description: Status Description
                    type: string
                    example: table_code is not exist
              examples:
                Invalid MSISDN:
                  value:
                    status: '20'
                    message: Invalid MSISDN
                    trx_id: 040520181127010000
                    result: ''
                Customer not active:
                  value:
                    status: '17'
                    message: Customer not active
                    trx_id: 040520181127010000
                    result: ''
                Parameter Param is invalid format:
                  value:
                    status: '21'
                    message: Parameter Param is invalid format
                    trx_id: 040520181127010000
                    result: ''
      tags:
      - Subscriber Check
      externalDocs:
        description: 'DigiHub endpoint reference: API Active Status v2'
        url: https://digihub.telkomsel.com/apis/V2/endpoint/137
